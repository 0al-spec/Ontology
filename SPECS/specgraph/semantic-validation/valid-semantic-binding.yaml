apiVersion: specgraph.io/v1alpha1
kind: Requirement
metadata:
  id: REQ-EXAMCALC-001
spec:
  title: Exam-specific calculator function enforcement
  statement: >
    The calculator shall enforce exam-specific allowed and denied function
    sets, require signed device-verifiable policy activation, lock the session
    after policy violations, and preserve audit evidence for review.
