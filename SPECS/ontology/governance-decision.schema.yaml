$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specgraph.io/schemas/ontology-governance-decision.schema.yaml"
title: OntologyGovernanceDecision
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
  - metadata
  - spec
properties:
  apiVersion:
    const: ontology-governance.specgraph.io/v1alpha1
  kind:
    const: OntologyGovernanceDecision
  metadata:
    type: object
    additionalProperties: false
    required:
      - id
      - createdAt
    properties:
      id:
        type: string
        pattern: "^[a-z0-9][a-z0-9._-]*$"
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
      source:
        type: string
      reviewUrl:
        type: string
  spec:
    type: object
    additionalProperties: false
    required:
      - targetPackage
      - decision
      - evidence
    properties:
      targetPackage:
        type: object
        additionalProperties: false
        required:
          - id
          - namespace
          - version
        properties:
          id:
            type: string
            pattern: "^[a-z][a-z0-9]*(\\.[a-z0-9][a-z0-9-]*)+$"
          namespace:
            type: string
            pattern: "^[a-z][a-z0-9-]*$"
          version:
            type: string
            pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$"
          source:
            type: string
          digest:
            $ref: "#/$defs/sha256Digest"
      priorVersion:
        type: object
        additionalProperties: false
        required:
          - version
        properties:
          version:
            type: string
            pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$"
          digest:
            $ref: "#/$defs/sha256Digest"
      decision:
        type: object
        additionalProperties: false
        required:
          - state
          - actor
          - decidedAt
          - rationale
        properties:
          state:
            enum:
              - candidate
              - under_review
              - changes_requested
              - rejected
              - approved
              - merged
              - superseded
              - withdrawn
          actor:
            type: object
            additionalProperties: false
            required:
              - id
              - kind
              - role
            properties:
              id:
                type: string
              kind:
                enum:
                  - human
                  - agent
              role:
                enum:
                  - authoring_agent
                  - proposer
                  - reviewer
                  - maintainer
              displayName:
                type: string
          decidedAt:
            type: string
            format: date-time
          rationale:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
          versionChange:
            enum:
              - none
              - patch
              - minor
              - major
          residualRisks:
            type: array
            items:
              type: string
          supersedes:
            type: object
            additionalProperties: false
            required:
              - decisionId
            properties:
              decisionId:
                type: string
              packageDigest:
                $ref: "#/$defs/sha256Digest"
          followUp:
            type: object
            additionalProperties: false
            properties:
              goldenExpectations:
                type: object
                additionalProperties: false
                required:
                  - action
                  - rationale
                properties:
                  action:
                    enum:
                      - no_change
                      - propose_update
                      - add_forbidden_surface
                  rationale:
                    type: string
      evidence:
        type: object
        additionalProperties: false
        required:
          - sourceIntent
          - candidatePackage
          - compilerValidation
        properties:
          sourceIntent:
            $ref: "#/$defs/evidenceRef"
          candidateArtifacts:
            type: array
            items:
              $ref: "#/$defs/evidenceRef"
          candidatePackage:
            $ref: "#/$defs/evidenceRef"
          critiqueReport:
            $ref: "#/$defs/evidenceRef"
          competencyQuestions:
            $ref: "#/$defs/evidenceRef"
          compilerValidation:
            $ref: "#/$defs/evidenceRef"
          repeatabilityReport:
            $ref: "#/$defs/evidenceRef"
          compatibilityReport:
            $ref: "#/$defs/evidenceRef"
          reviewRecord:
            $ref: "#/$defs/evidenceRef"
allOf:
  - if:
      properties:
        spec:
          properties:
            decision:
              properties:
                state:
                  enum:
                    - approved
                    - rejected
    then:
      properties:
        spec:
          properties:
            decision:
              properties:
                actor:
                  properties:
                    kind:
                      const: human
                    role:
                      const: reviewer
  - if:
      properties:
        spec:
          properties:
            decision:
              properties:
                state:
                  enum:
                    - merged
                    - superseded
    then:
      properties:
        spec:
          properties:
            decision:
              properties:
                actor:
                  properties:
                    kind:
                      const: human
                    role:
                      const: maintainer
  - if:
      properties:
        spec:
          properties:
            decision:
              properties:
                state:
                  const: superseded
    then:
      properties:
        spec:
          properties:
            decision:
              required:
                - supersedes
$defs:
  sha256Digest:
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  evidenceRef:
    type: object
    additionalProperties: false
    required:
      - uri
    properties:
      uri:
        type: string
      digest:
        $ref: "#/$defs/sha256Digest"
      result:
        enum:
          - pass
          - fail
          - partial
          - not_applicable
      notes:
        type: string
