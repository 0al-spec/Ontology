name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to populate
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release-binaries.yml'
      - 'tools/release/**'
      - 'Package.swift'
      - 'Package.resolved'

permissions:
  contents: read

concurrency:
  group: ontologyc-assets-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      label: ${{ steps.target.outputs.label }}
      release_id: ${{ steps.target.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test publication rules
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: Select and verify source
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_ID: ${{ github.event.release.id }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            printf 'sha=%s\nlabel=pr-%s\n' "$PR_SHA" "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then test "$GITHUB_REF" = "$DEFAULT_REF"; fi
            python3 tools/release/publish.py resolve "$TAG" > "$RUNNER_TEMP/release-target"
            if [[ $GITHUB_EVENT_NAME == release ]]; then
              grep -Fx "sha=$GITHUB_SHA" "$RUNNER_TEMP/release-target"
              grep -Fx "release_id=$RELEASE_ID" "$RUNNER_TEMP/release-target"
            fi
            cat "$RUNNER_TEMP/release-target" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: source
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, platform: macos-arm64}
          - {runner: ubuntu-24.04, platform: linux-x86_64}
    env:
      BUILD_LABEL: ${{ needs.source.outputs.label }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@v6
        with:
          path: pipeline
          persist-credentials: false
          sparse-checkout: tools/release
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Build and exercise extracted macOS CLI
        if: runner.os == 'macOS'
        run: bash pipeline/tools/release/package.sh "$PWD/source" "$RUNNER_TEMP/build" "$RUNNER_TEMP/dist" macos-arm64
      - name: Build Linux CLI on the Ubuntu 22.04 baseline
        if: runner.os == 'Linux'
        run: |
          mkdir "$RUNNER_TEMP/dist"
          docker run --rm -e BUILD_LABEL -e SOURCE_SHA \
            -v "$PWD/source:/source:ro" -v "$PWD/pipeline/tools/release:/tools:ro" \
            -v "$RUNNER_TEMP/dist:/dist" swift:6.0.3-jammy \
            bash /tools/package.sh /source /tmp/build /dist linux-x86_64
      - name: Exercise downloaded layout without an installed Swift toolchain
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e BUILD_LABEL -v "$RUNNER_TEMP/dist:/dist:ro" \
            -v "$PWD/source/SPECS/ontology/packages/examcalc:/example:ro" ubuntu:22.04 bash -euc '
            apt-get -qq update && apt-get -qq install --no-install-recommends -y libcurl4 libxml2 libicu70
            name=ontologyc-$BUILD_LABEL-linux-x86_64
            tar -xzf "/dist/$name.tar.gz" -C /tmp
            "/tmp/$name/ontologyc" check /example/domain-ontology-package.yaml
            "/tmp/$name/ontologyc" compile /example/domain-ontology-package.yaml --target typescript --out /tmp/generated
            cmp /tmp/generated/ontology.normalized.json /example/generated/ontology.normalized.json'
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/ontologyc-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  preview:
    if: github.event_name == 'pull_request'
    needs: [source, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: tools/release
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify the archives and produce checksums
        env:
          LABEL: ${{ needs.source.outputs.label }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 tools/release/publish.py verify "$LABEL" "$SOURCE_SHA" dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-preview-checksums
          path: dist/ontologyc-SHA256SUMS
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: tools/release
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release identity and attach missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.label }}
          RELEASE_ID: ${{ needs.source.outputs.release_id }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 tools/release/publish.py publish "$TAG" "$RELEASE_ID" "$SOURCE_SHA" dist
