name: Deploy DocC Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build DocC
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Compute CI cache keys
        id: cache-keys
        run: bash tools/ci-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM DocC cache
        uses: actions/cache@v4
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
            .build/plugins
          key: ${{ steps.cache-keys.outputs.docc-cache-key }}
          restore-keys: |
            ontology-docc-${{ steps.cache-keys.outputs.runner-fragment }}-${{ steps.cache-keys.outputs.swift-fragment }}-${{ steps.cache-keys.outputs.package-hash }}-
            ontology-docc-${{ steps.cache-keys.outputs.runner-fragment }}-${{ steps.cache-keys.outputs.swift-fragment }}-
            ontology-docc-${{ steps.cache-keys.outputs.runner-fragment }}-

      - name: Build OntologyRules documentation
        run: |
          mkdir -p docs
          swift package --allow-writing-to-directory ./docs/ontologyrules \
            generate-documentation \
            --target OntologyRules \
            --output-path ./docs/ontologyrules \
            --transform-for-static-hosting \
            --hosting-base-path Ontology/ontologyrules

      - name: Build OntologyCompiler documentation
        run: |
          mkdir -p docs
          swift package --allow-writing-to-directory ./docs/ontologycompiler \
            generate-documentation \
            --target OntologyCompiler \
            --output-path ./docs/ontologycompiler \
            --transform-for-static-hosting \
            --hosting-base-path Ontology/ontologycompiler

      - name: Add Pages index
        run: |
          touch docs/.nojekyll
          cat > docs/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <title>Ontology Technical Surface</title>
            <style>
              :root {
                color-scheme: light;
                --ink: #172017;
                --muted: #59645c;
                --line: #d7ded6;
                --surface: #f6f4ec;
                --card: #fffdf6;
                --accent: #2f6f55;
              }

              * {
                box-sizing: border-box;
              }

              html {
                min-height: 100%;
                background: linear-gradient(135deg, #fbf7eb 0%, var(--surface) 48%, #e8eee7 100%);
              }

              body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                color: var(--ink);
                font-family:
                  "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
                background: transparent;
              }

              main {
                width: min(920px, calc(100% - 32px));
                margin: 0 auto;
                padding: 72px 0;
                padding:
                  calc(72px + constant(safe-area-inset-top)) 0
                  calc(72px + constant(safe-area-inset-bottom));
                padding:
                  calc(72px + env(safe-area-inset-top)) 0
                  calc(72px + env(safe-area-inset-bottom));
              }

              .eyebrow {
                margin: 0 0 14px;
                color: var(--accent);
                font: 700 0.82rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
                letter-spacing: 0.08em;
                text-transform: uppercase;
              }

              h1 {
                max-width: 760px;
                margin: 0;
                font-size: clamp(2.8rem, 8vw, 6.2rem);
                font-weight: 700;
                line-height: 0.96;
                letter-spacing: 0;
              }

              .lead {
                max-width: 680px;
                margin: 28px 0 0;
                color: var(--muted);
                font-size: clamp(1.12rem, 2.5vw, 1.42rem);
                line-height: 1.55;
              }

              .grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
                margin-top: 42px;
              }

              a.card {
                display: block;
                min-height: 150px;
                padding: 24px;
                color: inherit;
                text-decoration: none;
                background: rgba(255, 253, 246, 0.86);
                border: 1px solid var(--line);
                border-radius: 8px;
                box-shadow: 0 24px 70px rgba(37, 52, 41, 0.08);
              }

              a.card:hover,
              a.card:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 4px;
              }

              .label {
                display: block;
                color: var(--accent);
                font: 700 0.78rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
                letter-spacing: 0.08em;
                text-transform: uppercase;
              }

              .title {
                display: block;
                margin-top: 14px;
                font-size: 1.42rem;
                font-weight: 700;
                line-height: 1.1;
              }

              .desc {
                display: block;
                margin-top: 12px;
                color: var(--muted);
                font-size: 1rem;
                line-height: 1.45;
              }

              .boundary {
                margin-top: 28px;
                padding-top: 22px;
                color: var(--muted);
                border-top: 1px solid var(--line);
                font: 0.92rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
              }

              @media (max-width: 720px) {
                main {
                  padding: 48px 0;
                  padding:
                    calc(48px + constant(safe-area-inset-top)) 0
                    calc(48px + constant(safe-area-inset-bottom));
                  padding:
                    calc(48px + env(safe-area-inset-top)) 0
                    calc(48px + env(safe-area-inset-bottom));
                }

                .grid {
                  grid-template-columns: 1fr;
                }
              }
            </style>
          </head>
          <body>
            <main>
              <p class="eyebrow">GitHub Pages technical root</p>
              <h1>Ontology technical surface.</h1>
              <p class="lead">
                Generated DocC documentation for the semantic rule layer and
                compiler layer of the Ontology project.
              </p>

              <section class="grid" aria-label="Documentation entrypoints">
                <a class="card" href="./ontologyrules/documentation/ontologyrules/">
                  <span class="label">Rules</span>
                  <span class="title">OntologyRules</span>
                  <span class="desc">
                    SpecificationCore-backed validation and decision rules for
                    ontology contracts.
                  </span>
                </a>
                <a class="card" href="./ontologycompiler/documentation/ontologycompiler/">
                  <span class="label">Compiler</span>
                  <span class="title">OntologyCompiler</span>
                  <span class="desc">
                    Import, validation, rendering, and publication surfaces for
                    ontology source artifacts.
                  </span>
                </a>
              </section>

              <p class="boundary">
                Boundary: this root is a documentation entrypoint. Product
                positioning and long-form project narrative belong in repository
                docs and future product surfaces.
              </p>
            </main>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
          include-hidden-files: true

  deploy:
    name: Deploy Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
