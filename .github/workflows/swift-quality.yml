name: Swift Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, format, test, coverage
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Compute CI cache keys
        id: cache-keys
        run: bash tools/ci-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore quality tool cache
        uses: actions/cache@v5
        with:
          path: ~/.ontology-ci/tools
          key: ${{ steps.cache-keys.outputs.quality-tools-cache-key }}
          restore-keys: |
            ontology-quality-tools-${{ steps.cache-keys.outputs.runner-fragment }}-

      - name: Restore SwiftPM quality cache
        uses: actions/cache@v5
        with:
          path: .build/ci-quality
          key: ${{ steps.cache-keys.outputs.quality-build-cache-key }}
          restore-keys: |
            ontology-quality-build-${{ steps.cache-keys.outputs.runner-fragment }}-${{ steps.cache-keys.outputs.swift-fragment }}-
            ontology-quality-build-${{ steps.cache-keys.outputs.runner-fragment }}-

      - name: Install quality tools
        run: bash tools/install-quality-tools.sh

      - name: Run Swift quality checks
        env:
          RUN_COVERAGE: "1"
          ONTOLOGY_SWIFT_SCRATCH_PATH: .build/ci-quality
        run: bash ./tools/swift-quality.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: SPECS/ontology/package-lock.json

      - name: Run TypeScript SDK smoke gate
        run: bash ./tools/typescript-smoke.sh

      - name: Build SpecSpace ontology viewer sample archive
        run: |
          set -euo pipefail
          archive_root=".build/ontology-viewer-artifacts/examcalc"
          archive_zip=".build/ontology-viewer-artifacts/examcalc-ontology-viewer-archive.zip"
          rm -rf ".build/ontology-viewer-artifacts"
          mkdir -p "$archive_root"
          cp SPECS/ontology/packages/examcalc/domain-ontology-package.yaml "$archive_root/domain-ontology-package.yaml"
          cp -R SPECS/ontology/packages/examcalc/generated "$archive_root/generated"
          swift run ontologyc export-viewer-archive-manifest \
            "$archive_root/domain-ontology-package.yaml" \
            --generated "$archive_root/generated" \
            --out "$archive_root/ontology-viewer-archive-manifest.json"
          (cd "$archive_root" && zip -r "../examcalc-ontology-viewer-archive.zip" .)
          test -s "$archive_zip"

      - name: Upload SpecSpace ontology viewer sample archive
        uses: actions/upload-artifact@v7
        with:
          name: examcalc-ontology-viewer-archive
          path: .build/ontology-viewer-artifacts/examcalc-ontology-viewer-archive.zip
          if-no-files-found: error
