name: Swift Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, format, test, coverage
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Install quality tools
        run: brew install swiftformat swiftlint

      - name: Run Swift quality checks
        env:
          RUN_COVERAGE: "1"
        run: bash ./tools/swift-quality.sh
