# SwiftLint is the non-formatting quality gate.
# Formatting rules are intentionally omitted to avoid conflicts with SwiftFormat.
included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - SPECS
  - plugins
  - tools

strict: false
reporter: "xcode"

only_rules:
  - cyclomatic_complexity
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - file_length
  - force_cast
  - force_try
  - force_unwrapping
  - function_body_length
  - function_parameter_count
  - identifier_name
  - implicitly_unwrapped_optional
  - type_body_length
  - type_name
  - unavailable_condition
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - unused_setter_value

cyclomatic_complexity:
  warning: 10
  error: 20

file_length:
  warning: 400
  error: 800

force_try:
  severity: warning

force_unwrapping:
  severity: warning

function_body_length:
  warning: 80
  error: 160

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - ir
    - to

type_body_length:
  warning: 300
  error: 500

type_name:
  min_length:
    warning: 3
    error: 1
  excluded:
    - T
